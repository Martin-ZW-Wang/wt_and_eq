name: Earthquake and Taipei Weather Discord Notify

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "目前專案根目錄："
          ls -la
          echo "目前 workflows 資料夾："
          ls -la .github/workflows || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python script
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -f "earthquake_notify.py" ]; then
            echo "找到根目錄 earthquake_notify.py"
            python earthquake_notify.py
          elif [ -f ".github/workflows/earthquake_notify.py" ]; then
            echo "找到 .github/workflows/earthquake_notify.py"
            python .github/workflows/earthquake_notify.py
          else
            echo "找不到 earthquake_notify.py"
            echo "請確認檔案名稱是不是 earthquake_notify.py"
            exit 1
          fi
